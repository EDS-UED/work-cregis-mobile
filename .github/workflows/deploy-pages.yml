name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-cregis-mobile
    steps:
      - name: Checkout work-cregis-mobile
        uses: actions/checkout@v4
        with:
          path: work-cregis-mobile
          fetch-depth: 0

      - name: Log work-cregis-mobile revision
        working-directory: work-cregis-mobile
        run: |
          echo "work-cregis-mobile SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Checkout eds-mobile
        uses: actions/checkout@v4
        with:
          repository: EDS-UED/eds-mobile
          ref: ae8ba3698fd510fb1422da26358830c632116c62
          fetch-depth: 0
          path: eds-mobile

      - name: Log eds-mobile revision
        working-directory: eds-mobile
        run: |
          echo "eds-mobile SHA: $(git rev-parse --short HEAD)"
          git log -1 --oneline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: work-cregis-mobile/package-lock.json

      - name: Install eds-mobile dependencies
        working-directory: eds-mobile
        run: pnpm install --frozen-lockfile

      - name: Build eds-mobile packages
        working-directory: eds-mobile
        run: pnpm build:mobile

      - name: Verify eds-mobile checkout
        run: test -f ../eds-mobile/packages/mobile/dist/index.js

      - name: Set Expo base path
        working-directory: work-cregis-mobile
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "EXPO_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "EXPO_BASE_URL=/${REPO}" >> "$GITHUB_ENV"
          fi

      - name: Install work-cregis-mobile dependencies
        run: npm ci

      - name: Build Pages artifact
        run: node scripts/build-pages-artifact.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: work-cregis-mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
